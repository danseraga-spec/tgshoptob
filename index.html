<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deus Ex Machina Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Глобальные настройки стилей - ТРУ-БРУТАЛИЗМ DARK MODE */
        :root {
            /* Инвертируем цвета для черного фона */
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --accent-color: #FFFFFF; /* Рамки и заливка кнопок теперь белые */
            --border-width: 2px;
            /* Шрифты сохраняем */
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Roboto', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color); /* Абсолютно черный фон */
            color: var(--text-color); /* Белый текст */
            padding: 15px;
            margin: 0;
            padding-bottom: 130px; /* Отступ под нижнюю панель */
            overflow-x: hidden;
            
            /* Эффект зернистости (Gritty Noise pattern) - оставляем для текстуры */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3P%3Cfilter id='noiseFilter'%3P%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3P%3C/filter%3P%3Crect width='100%' height='100%' filter='url(%23noiseFilter)'/%3P%3C/svg%3P");
            opacity: 0.98;
        }

        /* Заголовки - ЧБ контраст */
        h2 { 
            font-family: var(--font-serif);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center; 
            margin-bottom: 30px; 
            margin-top: 10px;
            border-bottom: var(--border-width) solid var(--text-color);
            padding-bottom: 10px;
            color: var(--text-color);
        }

        h3 {
            font-family: var(--font-serif);
            font-weight: 700;
            color: var(--text-color);
        }

        .hidden { display: none !important; }

        /* Элегантная типографика для служебных кнопок */
        .support-btn, .btn, .btn-green, .btn-outline {
            font-family: var(--font-serif) !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        /* Кнопка поддержки - черно-белая, контрастная */
        .support-btn {
            position: absolute; top: 15px; right: 15px;
            background-color: transparent; /* Прозрачный фон на черном */
            color: var(--text-color); /* Белый текст */
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            padding: 8px 15px;
            border-radius: 0; /* Острые углы */
            font-size: 11px; cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .support-btn:active {
            background-color: var(--accent-color); /* Белый фон при клике */
            color: var(--bg-color); /* Черный текст при клике */
        }

        /* Карточка товара - минимализм, высокий контраст на черном */
        .product-card {
            background-color: var(--bg-color); /* Черный фон карточки */
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            border-radius: 0; 
            padding: 20px; 
            margin-bottom: 30px;
            text-align: center; 
            position: relative;
        }

        .product-img { 
            width: 100%; 
            max-width: 250px; 
            height: auto;
            border: var(--border-width) solid var(--accent-color); /* Белая рамка фото */
            border-radius: 0;
            filter: none; /* УБРАЛИ ГРЕЙСКЕЙЛ - ФОТО В ЦВЕТЕ */
            margin-bottom: 15px;
            background-color: #FFFFFF; /* Белый фон для ЧБ фото если они на прозрачном фоне */
        }

        .product-title { 
            font-family: var(--font-serif);
            font-size: 21px; 
            font-weight: 700; 
            margin: 0 0 10px 0; 
            text-transform: uppercase;
            color: var(--text-color);
        }

        .product-desc { 
            font-size: 13px; 
            font-weight: 300;
            line-height: 1.5;
            margin-bottom: 15px; 
            color: var(--text-color);
            opacity: 0.95;
        }

        .product-price { 
            font-family: var(--font-sans);
            font-size: 19px; 
            font-weight: 700; 
            margin-bottom: 18px; 
            display: block;
            color: var(--text-color);
        }
        
        /* Селектор размера - прямоугольный на черном */
        .size-selector {
            padding: 12px; 
            border-radius: 0;
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            background: transparent; /* Прозрачный фон */
            color: var(--text-color); /* Белый текст */
            width: 100%; 
            max-width: 230px; 
            margin-bottom: 15px;
            font-family: var(--font-sans);
            font-size: 14px;
            appearance: none;
            text-align-last: center;
            cursor: pointer;
        }
        .size-selector option {
            background-color: var(--bg-color); /* Черный фон опций */
            color: var(--text-color); /* Белый текст опций */
        }

        /* Кнопки - Брутализм, контраст на черном (теперь белые кнопки с черным текстом) */
        .btn {
            background-color: var(--accent-color); /* Белый фон */
            color: var(--bg-color); /* Черный текст */
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            padding: 12px 25px; 
            border-radius: 0;
            font-size: 14px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 230px;
            transition: all 0.2s ease;
        }
        
        .btn:active {
            background-color: transparent; /* Прозрачный при клике */
            color: var(--text-color); /* Белый текст при клике */
        }
        
        /* Главные кнопки (теперь белые с черным текстом) */
        .btn-green { 
            background-color: var(--accent-color); /* Белый фон */
            color: var(--bg-color); /* Черный текст */
            border: var(--border-width) solid var(--accent-color);
            width: 100%; 
            max-width: none; 
            font-size: 17px; 
            padding: 15px;
            text-transform: uppercase;
            font-family: var(--font-serif);
            font-weight: 700;
            letter-spacing: 1.2px;
        }
        .btn-green:active {
            background-color: transparent;
            color: var(--text-color);
        }

        .btn-outline { 
            background-color: transparent; 
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            color: var(--text-color); /* Белый текст */
            margin-bottom: 15px; 
            width: 100%; 
            padding: 15px;
            border-radius: 0;
        }
        .btn-outline:active {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* Нижняя панель - ЧБ, контрастная */
        .cart-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--bg-color); /* Черный фон панели */
            border-top: var(--border-width) solid var(--accent-color); /* Белая рамка сверху */
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        
        .cart-panel-info {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--text-color);
        }
        .cart-panel-total {
            font-size: 21px;
            font-weight: 700;
            color: var(--text-color);
        }

        /* Список в корзине - ЧБ */
        #cart-items-list {
            border-top: var(--border-width) solid var(--accent-color);
        }
        .cart-item {
            border-bottom: 1px solid #444444; /* Темно-серая разделительная линия */
            padding: 15px 0;
            display: flex; justify-content: space-between; align-items: center;
            font-family: var(--font-sans);
            color: var(--text-color);
        }
        .cart-item-info {
            font-size: 15px;
            line-height: 1.4;
        }
        .cart-item-price {
            font-weight: 700;
        }
        .cart-item-remove { 
            color: var(--text-color); /* Белый текст */
            cursor: pointer; 
            font-size: 11px; 
            border: 1px solid var(--accent-color); /* Белая рамка */
            padding: 6px 12px; 
            border-radius: 0;
            text-transform: uppercase;
            font-family: var(--font-serif);
        }
        .cart-item-remove:active {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* Экран оплаты - ЧБ на черном */
        .payment-box {
            background-color: var(--bg-color);
            border: var(--border-width) solid var(--accent-color); /* Белая рамка */
            padding: 30px 20px; 
            border-radius: 0; 
            text-align: center; 
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .payment-box p {
            color: var(--text-color);
        }
        .card-number { 
            font-family: var(--font-sans);
            font-size: 24px; 
            font-weight: 700; 
            letter-spacing: 2px; 
            margin: 20px 0; 
            background-color: #FFFFFF; /* Белый фон для номера */
            color: #000000; /* Черный текст номера */
            padding: 12px;
            display: inline-block;
        }
        
    </style>
</head>
<body>

    <div id="catalog-page">
        <button class="support-btn" onclick="tg.openTelegramLink('https://t.me/demhost')">SUPPORT</button>
        <h2>Catalog</h2>

        <div class="product-card">
            <img src="bratva2.png" alt="Братва 2" class="product-img">
            <div class="product-title">T-Shirt «Братва 2»</div>
            <div class="product-desc">Только ручная стирка при 30°C. 100% Хлопок.</div>
            <span class="product-price">1 250 ₽</span>
            <select id="size-1" class="size-selector">
                <option value="XS">Размер: XS</option><option value="S">Размер: S</option><option value="M" selected>Размер: M</option><option value="L">Размер: L</option><option value="XL">Размер: XL</option><option value="XXL">Размер: XXL</option>
            </select><br>
            <button class="btn" onclick="addToCart('Футболка «Братва 2»', 1250, 'size-1')">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="bratva1.png" alt="Братва 1" class="product-img">
            <div class="product-title">T-Shirt «Братва 1»</div>
            <div class="product-desc">Только ручная стирка при 30°C. 100% Хлопок.</div>
            <span class="product-price">1 250 ₽</span>
            <select id="size-2" class="size-selector">
                <option value="XS">Размер: XS</option><option value="S">Размер: S</option><option value="M" selected>Размер: M</option><option value="L">Размер: L</option><option value="XL">Размер: XL</option><option value="XXL">Размер: XXL</option>
            </select><br>
            <button class="btn" onclick="addToCart('Футболка «Братва 1»', 1250, 'size-2')">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="bratva1_5.png" alt="Братва 1,5" class="product-img">
            <div class="product-title">T-Shirt «Братва 1.5»</div>
            <div class="product-desc">Только ручная стирка при 30°C. 100% Хлопок.</div>
            <span class="product-price">1 250 ₽</span>
            <select id="size-3" class="size-selector">
                <option value="XS">Размер: XS</option>
