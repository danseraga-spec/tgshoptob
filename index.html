<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMclo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }
        .product {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Наличие</h2>

    <div class="product">
        <h3>футба1</h3>
        <p>хорошая</p>
        <p><b>3 500 ₽</b></p>
        <button onclick="buy('Худи Этерия')">Добавить в корзину</button>
    </div>

    <div class="product">
        <h3>футба2</h3>
        <p>пиздатая</p>
        <p><b>3 200 ₽</b></p>
        <button onclick="buy('Свитшот Феррум')">Добавить в корзину</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function buy(itemName) {
            tg.sendData(itemName); 
            tg.close();
        }
    </script>

</body>
</html>
